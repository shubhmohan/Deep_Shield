<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="DeepShield - explainable deepfake detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45d3b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#45d3b8" stop-opacity="1"/>
      <stop offset="1" stop-color="#45d3b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45d3b8" stop-opacity="0"/>
      <stop offset="1" stop-color="#45d3b8" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="heatHot"><stop offset="0" stop-color="#f4694b" stop-opacity="0.95"/><stop offset="0.55" stop-color="#f4694b" stop-opacity="0.35"/><stop offset="1" stop-color="#f4694b" stop-opacity="0"/></radialGradient>
    <radialGradient id="heatWarm"><stop offset="0" stop-color="#f2c14e" stop-opacity="0.85"/><stop offset="0.6" stop-color="#f2c14e" stop-opacity="0.25"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263049" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="340" rx="22"/></clipPath>
    <clipPath id="faceBox"><rect x="880" y="48" width="240" height="250" rx="6"/></clipPath>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 84px; letter-spacing: -2px; }
    .sub   { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 23px; fill: #8b95a7; }
    .mono  { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .drift { animation: drift 14s linear infinite; }
    .scan  { animation: scan 3.4s ease-in-out infinite alternate; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    .pulseA{ animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulseB{ animation: pulse 3.2s ease-in-out -1.1s infinite; transform-box: fill-box; transform-origin: center; }
    .pulseC{ animation: pulse 3.2s ease-in-out -2.2s infinite; transform-box: fill-box; transform-origin: center; }
    .px1 { animation: rise 7s linear infinite; }
    .px2 { animation: rise 9s linear -3s infinite; }
    .px3 { animation: rise 8s linear -5s infinite; }
    .bracket { animation: bracket 3.4s ease-in-out infinite alternate; }
    @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    @keyframes scan   { from { transform: translateY(0); } to { transform: translateY(238px); } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes pulse  { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes rise   { from { transform: translateY(40px); opacity: 0; } 15% { opacity: .8; } 85% { opacity: .8; } to { transform: translateY(-340px); opacity: 0; } }
    @keyframes bracket{ from { opacity: .55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <g class="drift" opacity="0.5"><rect x="0" y="0" width="1360" height="340" fill="url(#grid)"/></g>

    <!-- drifting pixels -->
    <g fill="#45d3b8">
      <rect class="px1" x="120" y="330" width="6" height="6"/>
      <rect class="px2" x="420" y="330" width="5" height="5" fill="#f4694b"/>
      <rect class="px3" x="700" y="330" width="6" height="6"/>
      <rect class="px1" x="610" y="330" width="4" height="4" fill="#f2c14e" style="animation-delay:-4s"/>
      <rect class="px2" x="250" y="330" width="4" height="4" style="animation-delay:-6s"/>
    </g>

    <!-- title block -->
    <text x="70" y="150" class="title"><tspan fill="#e9edf3">Deep</tspan><tspan fill="#45d3b8">Shield</tspan></text>
    <text x="74" y="196" class="sub">Deepfake detection that shows its evidence.</text>
    <g class="mono" font-size="16">
      <text x="74" y="252" fill="#45d3b8">CLIP&#160;ViT-L/14</text>
      <text x="212" y="252" fill="#3a4663">/</text>
      <text x="234" y="252" fill="#8b95a7">DF40</text>
      <text x="292" y="252" fill="#3a4663">/</text>
      <text x="314" y="252" fill="#8b95a7">Grad-CAM</text>
      <text x="418" y="252" fill="#3a4663">/</text>
      <text x="440" y="252" fill="#8b95a7">FastAPI</text>
      <text x="522" y="252" fill="#3a4663">/</text>
      <text x="544" y="252" fill="#8b95a7">React</text>
    </g>
    <g transform="translate(74 282)">
      <circle cx="6" cy="6" r="5" fill="#45d3b8" class="blink"/>
      <text x="22" y="11" class="mono" font-size="14" fill="#8b95a7">face-first pipeline &#183; explainable verdicts</text>
    </g>

    <!-- face scanner -->
    <g>
      <rect x="880" y="48" width="240" height="250" rx="6" fill="#0d1424" stroke="#263049"/>
      <g clip-path="url(#faceBox)">
        <!-- abstract head + shoulders -->
        <path d="M900 298 C905 250 940 238 1000 236 C1060 238 1095 250 1100 298 Z" fill="#162038" stroke="#2f3c5c" stroke-width="1.5"/>
        <ellipse cx="1000" cy="150" rx="62" ry="80" fill="#162038" stroke="#45d3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
        <!-- landmarks -->
        <g fill="#45d3b8" opacity=".85">
          <circle cx="978" cy="136" r="2.6"/><circle cx="1022" cy="136" r="2.6"/>
          <circle cx="1000" cy="160" r="2.2"/><circle cx="984" cy="188" r="2.2"/><circle cx="1016" cy="188" r="2.2"/>
        </g>
        <path d="M966 128 q12 -8 24 0 M1010 128 q12 -8 24 0 M984 194 q16 10 32 0" fill="none" stroke="#45d3b8" stroke-width="1.4" opacity=".7"/>
        <!-- heat blobs -->
        <circle class="pulseA" cx="976" cy="140" r="34" fill="url(#heatHot)"/>
        <circle class="pulseB" cx="1030" cy="176" r="30" fill="url(#heatWarm)"/>
        <circle class="pulseC" cx="1000" cy="206" r="26" fill="url(#heatHot)"/>
        <!-- scan line -->
        <g class="scan">
          <rect x="880" y="48" width="240" height="26" fill="url(#scanGlow)"/>
          <rect x="880" y="72" width="240" height="2.5" fill="url(#scan)"/>
        </g>
      </g>
      <!-- corner brackets -->
      <g class="bracket" fill="none" stroke="#45d3b8" stroke-width="3" stroke-linecap="round">
        <path d="M870 76 V40 a4 4 0 0 1 4 -4 H910"/>
        <path d="M1130 76 V40 a4 4 0 0 0 -4 -4 H1090"/>
        <path d="M870 270 V306 a4 4 0 0 0 4 4 H910"/>
        <path d="M1130 270 V306 a4 4 0 0 1 -4 4 H1090"/>
      </g>
      <text x="1000" y="326" text-anchor="middle" class="mono" font-size="13" fill="#8b95a7" letter-spacing="3">ANALYZING<tspan class="blink">_</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="22" fill="none" stroke="#263049"/>
</svg>
